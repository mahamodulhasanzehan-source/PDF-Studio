[package]
name = "pdf-studio"
version = "1.0.0"
description = "PDF Studio — Offline PDF Editor, Cropper & Extractor"
authors = ["PDF Studio"]
edition = "2021"

[lib]
name = "pdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
